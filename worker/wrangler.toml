name = "triboro-chat"
main = "src/worker.js"
compatibility_date = "2026-04-01"

# KV holds residents, chat history, rate-limit counters, and the global daily ceiling.
# Run once: `wrangler kv namespace create TRIBORO` and paste the id below.
[[kv_namespaces]]
binding = "TRIBORO"
id = "88af387c926d469a94d698943ac796d1"

# Workers AI — on-platform inference with a free daily allocation. No API key,
# no external fetch, runs at the edge alongside this Worker.
[ai]
binding = "AI"

# Public configuration — safe to commit. Secrets (ANTHROPIC_API_KEY) are set with
# `wrangler secret put ANTHROPIC_API_KEY` and never appear in this file. Use the
# PERSONAL Anthropic key (botoole12@gmail.com), never a New Consensus key.
[vars]
# Which backend answers DMs: "workers-ai" (free) or "claude" (paid, better).
# Switching to "claude" additionally needs the ANTHROPIC_API_KEY secret set.
CHAT_PROVIDER = "workers-ai"

# Workers AI model. Check the catalogue for current free-tier options:
#   npx wrangler ai models
WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"

# Used only when CHAT_PROVIDER = "claude".
CLAUDE_MODEL = "claude-haiku-4-5"

# Per-IP request budget on /api/chat. Sliding 1-hour window, KV-backed.
CHAT_PER_IP_PER_HOUR = "20"

# Per-IP register limit so one address can't farm tokens to multiply daily caps.
REGISTER_PER_IP_PER_DAY = "5"

# Hard daily request ceiling across all users. Hit it and /api/chat starts
# refusing with 503 until UTC midnight. Cheap insurance against runaway abuse.
GLOBAL_DAILY_CHAT_LIMIT = "2000"

# Per-resident daily limit (matches server.py).
DAILY_MESSAGE_LIMIT = "50"

# CORS allowlist — comma-separated origins that may call the chat API.
# Update after GH Pages goes live (e.g. https://billotool.github.io).
ALLOWED_ORIGINS = "http://localhost:8080,https://billotool.github.io"
